name: Playwright Tests
on:
  pull_request:
  push:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v16
      with:
        name: devenv
    - uses: docker/setup-docker-action@v5
    - name: Install devenv.sh
      run: nix profile add nixpkgs#devenv

    - name: Install frontend packages
      shell: devenv --profile testing shell bash -- -e {0}
      run: |
        cd frontend
        npm install

    - name: Start backend / frontend
      run: devenv --profile testing up -d

    # When not on main, fetch screenshots and run tests
    - name: Run Playwright tests
      if: github.ref != 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: devenv --profile testing shell ./frontend/playwright_tests.sh --reporter line

    # When on main, update snapshots as the standard
    - name: Run Playwright tests (update snapshots)
      if: github.ref == 'refs/heads/main'
      run: devenv --profile testing shell ./frontend/playwright_tests.sh --reporter line --update-shapshots

    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: screenshots
        path: frontend/tests/__screenshots__/
        retention-days: 30
