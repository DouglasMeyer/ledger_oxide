name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # When not on main, fetch screenshots and run tests
    - name: Fetch screenshots (not main)
      if: github.ref != 'refs/heads/main'
      run: ./fetch_asset.sh "$GITHUB_BASE_REF"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Run Playwright tests
      if: github.ref != 'refs/heads/main'
      run: npx playwright test

    # When on main, update snapshots as the standard
    - name: Run Playwright tests (update snapshots)
      if: github.ref == 'refs/heads/main'
      run: npx playwright test --update-snapshots

    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: screenshots
        path: frontend/tests/__screenshots__/
        retention-days: 30
